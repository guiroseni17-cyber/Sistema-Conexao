<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Termo de responsabilidade - Troca</title>
<link rel="stylesheet" href="css/style.css">
<style>
    body { background: #E9EAEE; padding: 24px; }

    .termo-nav { max-width: 800px; margin: 0 auto 14px; display: flex; gap: 8px; justify-content: flex-end; }

    .termo { max-width: 800px; margin: 0 auto; background: #fff; padding: 36px 44px 44px; color: #000; font-family: Arial, Helvetica, sans-serif; font-size: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    .termo table { width: 100%; border-collapse: collapse; }
    .termo td, .termo th { border: 1px solid #000 !important; padding: 2px 4px; vertical-align: top; text-align: left; font-size: 12px; line-height: 1.3; }
    .termo th { background: #d9d9d9; font-weight: 700; }

    /* Cabeçalho: marca | dados da loja | data da venda */
    .t-topo td { padding: 8px 10px; vertical-align: middle; text-align: center; }
    .t-marca { width: 27%; font-size: 20px !important; font-weight: 700; white-space: nowrap; }
    .t-loja { font-weight: 700; line-height: 1.35; }
    .t-data { width: 18%; font-weight: 700; line-height: 1.5; }

    .t-vendedor { text-align: center; margin: 14px 0 12px; font-size: 12.5px; }
    .t-vendedor b { font-weight: 700; }

    .t-titulo { font-weight: 700; font-size: 12px; margin: 10px 0 2px; }

    .t-upgrades th { text-align: center; }
    .t-upgrades .c { text-align: center; width: 70px; }
    .t-upgrades td, .t-upgrades th { padding: 2px 4px; }
    .t-upgrades .v { text-align: center; width: 130px; }

    .t-declaracao { border: 1px solid #000; padding: 2px 4px; line-height: 1.38; }
    .t-declaracao p { margin: 0; }

    .t-assinaturas { display: flex; gap: 108px; margin-top: 44px; padding: 0 2px; }
    .t-assinaturas div { flex: 1; border-top: 1px solid #000; text-align: center; padding-top: 5px; font-size: 12px; }

    .t-vazio { text-align: center; padding: 30px 0; color: #555; }

    @page { size: A4; margin: 12mm; }
    @media print {
        body { background: #fff; padding: 0; }
        .termo-nav { display: none; }
        .termo { box-shadow: none; max-width: 100%; padding: 0; }
        .termo * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
</style>
</head>
<body>
    <div class="termo-nav">
        <button class="btn btn-primary" onclick="window.print()">🖨️ Imprimir termo</button>
        <a class="btn btn-secondary" href="pedidos.html">← Voltar aos pedidos</a>
    </div>

    <div class="termo" id="termo">Carregando...</div>

<script src="js/api.js"></script>
<script src="js/termo-troca.js"></script>
</body>
</html>
