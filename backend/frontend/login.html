<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strock Phone - Entrar</title>
<link rel="stylesheet" href="css/style.css">
<style>
    .login-screen {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--gradient-ink);
        position: relative;
        overflow: hidden;
    }
    .login-screen::before {
        content: "";
        position: absolute;
        top: -140px;
        right: -120px;
        width: 440px;
        height: 440px;
        border-radius: 50%;
        background: var(--gradient-primary);
        opacity: .3;
        filter: blur(70px);
    }
    .login-card {
        position: relative;
        background: var(--surface);
        border-radius: 24px;
        padding: 36px 34px;
        width: 100%;
        max-width: 380px;
        box-shadow: 0 30px 60px -20px rgba(0,0,0,0.5);
    }
    .login-card .brand {
        border-bottom: none;
        padding: 0 0 22px 0;
        margin-bottom: 4px;
        color: var(--text);
        justify-content: center;
        font-size: 22px;
    }
    .login-erro {
        display: none;
        background: rgba(223,32,46,0.08);
        color: var(--destructive);
        border: 1px solid rgba(223,32,46,0.25);
        padding: 10px 12px;
        border-radius: 12px;
        font-size: 12.5px;
        margin-bottom: 14px;
    }
    .login-dica {
        text-align: center;
        font-size: 11.5px;
        color: var(--text-muted);
        margin-top: 16px;
    }
</style>
</head>
<body>
<div class="login-screen">
    <div class="login-card">
        <div class="brand"><span class="mark">忍</span> Strock Phone</div>
        <div id="login-erro" class="login-erro"></div>
        <form id="form-login">
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="email" required autofocus>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="senha" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; margin-top:6px;">Entrar</button>
        </form>
        <div class="login-dica">
            Primeiro acesso? admin@foneninja.com / admin123<br>(troque a senha assim que entrar)
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
