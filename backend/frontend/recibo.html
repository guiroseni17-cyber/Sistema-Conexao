<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recibo de Venda</title>
<link rel="stylesheet" href="css/style.css">
<style>
    /* Recibo 100% preto e branco (tela e impressão) */
    body { background: #E9EAEE; padding: 24px; }
    .rec { max-width: 800px; margin: 0 auto; background: #fff; padding: 28px 30px; font-family: Arial, Helvetica, sans-serif; font-size: 11px; color: #000; }
    .rec * { color: #000; }
    .rec table { width: 100%; border-collapse: collapse; }
    .rec th, .rec td { border: 1px solid #000; padding: 2px 4px; text-align: left; vertical-align: top; background: #fff; }
    .rec th { background: #ddd; font-weight: 700; text-transform: none; letter-spacing: 0; font-size: 11px; }
    .rec .c { text-align: center; }
    .rec .num { text-align: left; white-space: nowrap; }

    /* Cabeçalho: loja | dados | data da venda */
    .rec-topo td { padding: 6px 8px; text-align: center; vertical-align: middle; }
    .rec-topo .marca { width: 26%; font-size: 18px; font-weight: 700; }
    .rec-topo .data { width: 22%; font-weight: 700; }
    .rec-topo .loja { font-weight: 700; line-height: 1.35; }

    .rec-ident { text-align: center; margin: 12px 0 8px; line-height: 1.5; font-size: 11px; }

    .secao-titulo { font-size: 11px; font-weight: 700; text-transform: uppercase; margin: 10px 0 2px; }

    .rec-tot td { border: 1px solid #000; font-weight: 700; }
    .rec-tot .sem-borda { border: 0; }

    .rec-obs-texto { border: 1px solid #000; padding: 4px 6px; min-height: 28px; white-space: pre-wrap; }

    /* Assinaturas */
    .rec-assinaturas { display: flex; gap: 40px; margin-top: 44px; }
    .rec-assinaturas div { flex: 1; border-top: 1px solid #000; text-align: center; padding-top: 4px; font-size: 10px; }

    /* Termo de garantia (texto fixo) */
    #r-garantia { margin-top: 16px; padding-top: 10px; border-top: 1px dashed #000; font-size: 9px; line-height: 1.4; text-align: justify; }
    #r-garantia h5 { margin: 0 0 6px; font-size: 10px; text-align: center; }
    #r-garantia h6 { margin: 8px 0 2px; font-size: 9.5px; }
    #r-garantia p { margin: 0 0 2px; }

    .rec-nav { max-width: 800px; margin: 0 auto 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .rec-nav .rec-nav-marca { font-family: 'Space Grotesk', 'Inter', sans-serif; font-weight: 700; color: var(--navy); margin-right: auto; }
    .rec-nav a { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; font-size: 13px; font-weight: 600; color: var(--navy); }
    .rec-nav a:hover { background: #F7F8FB; border-color: var(--navy-light); }
    .rec-nav a.destaque { background: var(--accent); border-color: var(--accent); color: #fff; }
    .rec-nav a.destaque:hover { background: var(--accent-dark); }
    .rec-acoes { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 20px; }

    @media (max-width: 640px) {
        .rec { padding: 14px 10px; overflow-x: auto; }
    }

    @page { size: A4; margin: 8mm; }
    @media print {
        .rec-nav, .rec-acoes { display: none; }
        body { background: #fff; padding: 0; }
        .rec { max-width: 100%; padding: 0; }
        /* O termo de garantia vai para a página seguinte, em 2 colunas */
        #r-garantia { break-before: page; page-break-before: always; margin: 0; padding: 0; border-top: 0; column-count: 2; column-gap: 18px; font-size: 8.5px; line-height: 1.35; }
        #r-garantia h5 { column-span: all; font-size: 11px; margin-bottom: 8px; }
        #r-garantia h6 { break-after: avoid; }
        /* Sem cores: tudo em preto sobre branco (cinza só no fundo do cabeçalho das tabelas) */
        .rec, .rec * { -webkit-print-color-adjust: economy; print-color-adjust: economy; }
    }
</style>
</head>
<body>
    <nav class="rec-nav">
        <span class="rec-nav-marca">Conexão Iphone</span>
        <a href="index.html">▤ Dashboard</a>
        <a href="pedidos.html">🧾 Pedidos</a>
        <a href="compras.html">📥 Compras</a>
        <a href="produtos.html">📦 Estoque</a>
        <a href="clientes.html">👤 Clientes</a>
        <a href="novo-pedido.html" class="destaque">+ Nova venda</a>
    </nav>

    <div class="rec" id="recibo">

        <table class="rec-topo">
            <tr>
                <td class="marca" id="r-marca"></td>
                <td class="loja" id="r-loja"></td>
                <td class="data" id="r-data"></td>
            </tr>
        </table>

        <div class="rec-ident" id="r-ident">Carregando...</div>

        <p class="secao-titulo">Consumidor</p>
        <table id="r-cliente"></table>

        <p class="secao-titulo">Produtos</p>
        <table>
            <thead>
                <tr>
                    <th class="c" style="width:12%">Código/SKU</th>
                    <th class="c">Descrição</th>
                    <th class="c" style="width:9%">Garantia</th>
                    <th class="c" style="width:5%">Qtd</th>
                    <th class="c" style="width:12%">Valor Unit.</th>
                    <th class="c" style="width:12%">Total</th>
                </tr>
            </thead>
            <tbody id="r-itens"></tbody>
        </table>
        <table class="rec-tot" id="r-total"></table>

        <p class="secao-titulo">Pagamento</p>
        <table>
            <thead>
                <tr><th class="c">Forma de Pagamento</th><th class="c" style="width:18%">Valor Pago</th></tr>
            </thead>
            <tbody id="r-pagamentos"></tbody>
        </table>

        <div id="r-obs-bloco" style="display:none;">
            <p class="secao-titulo">Observações</p>
            <div class="rec-obs-texto" id="r-observacoes"></div>
        </div>

        <div class="rec-assinaturas">
            <div>Assinatura do cliente</div>
            <div>Assinatura da loja</div>
        </div>

        <div id="r-garantia"></div>
    </div>

    <div class="rec-acoes">
        <button class="btn btn-primary" onclick="window.print()">🖨️ Imprimir recibo</button>
        <a class="btn btn-secondary" href="pedidos.html">← Voltar aos pedidos</a>
        <a class="btn btn-secondary" href="novo-pedido.html">+ Nova venda</a>
    </div>

<script src="js/api.js"></script>
<script src="js/garantia.js"></script>
<script src="js/recibo.js"></script>
</body>
</html>
