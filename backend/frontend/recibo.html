<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recibo do Pedido</title>
<link rel="stylesheet" href="css/style.css">
<style>
    .rec {
        --cor-principal: #1f2a44;
        --cor-destaque: #e63946;
        --cor-fundo-suave: #f4f6fa;
        --cor-borda: #dde2ec;
    }
    body { background: #E9EAEE; padding: 24px; }
    .rec { max-width: 800px; margin: 0 auto; background: #fff; border-radius: 10px; overflow: hidden; font-size: 12.5px; color: #222; box-shadow: 0 2px 10px rgba(0,0,0,.08); }

    /* Faixa do topo */
    .rec-topo { background: var(--cor-principal); color: #fff; display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 22px 30px; }
    .rec-marca { display: flex; align-items: center; gap: 14px; }
    .rec-marca img { width: 64px; height: 64px; object-fit: contain; border-radius: 8px; background: #000; }
    .rec-loja { font-size: 11px; line-height: 1.55; opacity: .9; }
    .rec-pedido { text-align: right; }
    .rec-pedido h1 { margin: 0; font-size: 26px; letter-spacing: .02em; }
    .rec-pedido .ref { font-size: 11px; opacity: .8; margin-top: 2px; }
    .rec-pedido .data { display: inline-block; margin-top: 8px; background: var(--cor-destaque); padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }

    .rec-corpo { padding: 24px 30px 30px; }

    /* Dados do cliente (bloco compacto, 2 colunas) */
    #r-cliente { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 24px; background: var(--cor-fundo-suave); border: 1px solid var(--cor-borda); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; }
    #r-cliente div:last-child { grid-column: 1 / -1; }
    #r-cliente b { color: #666; font-size: 10.5px; text-transform: uppercase; margin-right: 4px; }

    .secao-titulo { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--cor-destaque); font-weight: 700; margin: 0 0 8px; }

    /* Tabelas */
    .rec table { width: 100%; border-collapse: collapse; }
    .rec th { text-align: left; font-size: 10.5px; text-transform: uppercase; color: #fff; background: var(--cor-principal); padding: 7px 10px; }
    .rec th:first-child { border-radius: 6px 0 0 6px; }
    .rec th:last-child { border-radius: 0 6px 6px 0; }
    .rec td { padding: 8px 10px; }
    .rec tbody tr:nth-child(even) { background: var(--cor-fundo-suave); }
    .rec .num { text-align: right; white-space: nowrap; }
    #tabela-itens { margin-bottom: 20px; }

    /* Pagamento: parcelas pequenas à esquerda, total à direita (abaixo dos itens) */
    .rec-pagto { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 14px; }
    .rec-pagto table { width: 62%; font-size: 11px; }
    .rec-pagto th, .rec-pagto td { padding: 3px 8px; }
    .rec-total { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; color: var(--cor-principal); }
    .rec-total b { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: #666; }
    .rec-total span { font-size: 17px; font-weight: 700; }

    .rec-obs { margin-top: 20px; }
    #r-observacoes { min-height: 34px; border-left: 3px solid var(--cor-borda); padding: 4px 12px; color: #444; }

    /* Assinaturas */
    .rec-assinaturas { display: flex; gap: 40px; margin-top: 48px; }
    .rec-assinaturas div { flex: 1; border-top: 1px solid #888; text-align: center; padding-top: 4px; font-size: 10.5px; color: #666; }

    /* Termo de garantia (texto fixo) */
    #r-garantia { margin-top: 14px; padding-top: 10px; border-top: 1px dashed var(--cor-borda); font-size: 9px; line-height: 1.4; color: #444; text-align: justify; }
    #r-garantia h5 { margin: 0 0 6px; font-size: 10px; text-align: center; color: var(--cor-principal); }
    #r-garantia h6 { margin: 8px 0 2px; font-size: 9.5px; color: var(--cor-principal); }
    #r-garantia p { margin: 0 0 2px; }

    .rec-acoes { text-align: center; margin-top: 20px; }

    @media (max-width: 640px) {
        #r-cliente { grid-template-columns: 1fr; }
        .rec-pagto { flex-direction: column; }
        .rec-pagto table { width: 100%; }
        .rec-total { align-items: flex-start; }
        .rec-topo { flex-direction: column; align-items: flex-start; }
        .rec-pedido { text-align: left; }
    }
    .rec-nav { max-width: 800px; margin: 0 auto 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .rec-nav .rec-nav-marca { font-family: 'Space Grotesk', 'Inter', sans-serif; font-weight: 700; color: var(--navy); margin-right: auto; }
    .rec-nav a { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; font-size: 13px; font-weight: 600; color: var(--navy); }
    .rec-nav a:hover { background: #F7F8FB; border-color: var(--navy-light); }
    .rec-nav a.destaque { background: var(--accent); border-color: var(--accent); color: #fff; }
    .rec-nav a.destaque:hover { background: var(--accent-dark); }
    .rec-acoes { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    @page { size: A4; margin: 8mm; }
    @media print {
        .rec-nav { display: none; }
        .rec-topo { padding: 12px 20px; }
        .rec-marca img { width: 48px; height: 48px; }
        .rec-pedido h1 { font-size: 22px; }
        .rec-corpo { padding: 12px 20px 10px; }
        #r-cliente { margin-bottom: 8px; padding: 6px 12px; }
        .rec-pagto { margin-bottom: 8px; }
        .rec-pagto table { font-size: 10px; }
        .rec-pagto th, .rec-pagto td { padding: 2px 6px; }
        .rec td { padding: 4px 8px; }
        #tabela-itens { margin-bottom: 10px; }
        .rec-assinaturas { margin-top: 28px; }
        /* O termo de garantia vai para a página seguinte, em 2 colunas */
        #r-garantia { break-before: page; page-break-before: always; margin: 0; padding: 0; border-top: 0; column-count: 2; column-gap: 18px; font-size: 8.5px; line-height: 1.35; }
        #r-garantia h5 { column-span: all; font-size: 11px; margin-bottom: 8px; }
        #r-garantia h6 { break-after: avoid; }
        body { background: #fff; padding: 0; }
        .rec { box-shadow: none; border-radius: 0; max-width: 100%; }
        .rec-acoes { display: none; }
        .rec * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
</style>
</head>
<body>
    <nav class="rec-nav">
        <span class="rec-nav-marca">Strock Phone</span>
        <a href="index.html">▤ Dashboard</a>
        <a href="pedidos.html">🧾 Pedidos</a>
        <a href="compras.html">📥 Compras</a>
        <a href="produtos.html">📦 Estoque</a>
        <a href="clientes.html">👤 Clientes</a>
        <a href="novo-pedido.html" class="destaque">+ Nova venda</a>
    </nav>
    <div class="rec" id="recibo">

        <div class="rec-topo">
            <div class="rec-marca">
                <img id="r-logo" src="img/logo.png" alt="" onerror="this.style.display='none'">
                <div class="rec-loja" id="r-loja"></div>
            </div>
            <div class="rec-pedido">
                <h1 id="r-numero">Carregando...</h1>
                <div class="ref" id="r-ref"></div>
                <div class="data" id="r-data"></div>
            </div>
        </div>

        <div class="rec-corpo">

            <p class="secao-titulo">Dados do cliente</p>
            <div id="r-cliente"></div>

            <p class="secao-titulo">Dados do pedido</p>
            <table id="tabela-itens">
                <thead>
                    <tr><th>Descrição</th><th class="num">Qtde.</th><th class="num">V. unit.</th><th class="num">V. total</th></tr>
                </thead>
                <tbody id="r-itens"></tbody>
            </table>

            <p class="secao-titulo">Pagamento</p>
            <div class="rec-pagto">
                <table>
                    <thead>
                        <tr><th>Parcela</th><th>Data</th><th class="num">Valor</th><th>Forma</th></tr>
                    </thead>
                    <tbody id="r-parcelas"></tbody>
                </table>
                <div class="rec-total" id="r-total"></div>
                <div class="rec-pag-obs" id="r-pag-obs"></div>
            </div>

            <div class="rec-obs" id="r-obs-bloco" style="display:none;">
                <p class="secao-titulo">Observações</p>
                <div id="r-observacoes"></div>
            </div>

            <div class="rec-assinaturas">
                <div>Assinatura do cliente</div>
                <div>Assinatura da loja</div>
            </div>

            <div id="r-garantia"></div>
        </div>
    </div>

    <div class="rec-acoes">
        <button class="btn btn-primary" onclick="window.print()">🖨️ Imprimir recibo</button>
        <a class="btn btn-secondary" href="pedidos.html">← Voltar aos pedidos</a>
        <a class="btn btn-secondary" href="novo-pedido.html">+ Nova venda</a>
    </div>

<script src="js/api.js"></script>
<script src="js/garantia.js"></script>
<script src="js/recibo.js"></script>
</body>
</html>
